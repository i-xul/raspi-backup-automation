
# Raspberry Pi 4 configuration backup

RESTIC_REPOSITORY="/mnt/usb2_raid/rpi4-config-backup/repository"
RESTIC_PASSWORD_FILE="/etc/raspi-backup-automation/raspi4/restic-password"

BACKUP_MOUNT="/mnt/usb2_raid"
BACKUP_UUID="bd29624e-41f0-43f5-a656-c341d67704cd"
BACKUP_FSTYPE="ext4"

LOG_DIR="/var/log/raspi-backup-automation"
LOG_FILE="${LOG_DIR}/raspi4-config-backup.log"

RESTIC_KEEP_WEEKLY=8
RESTIC_KEEP_MONTHLY=12
RESTIC_KEEP_YEARLY=3

RETENTION_DRY_RUN=true
RETENTION_LOG_FILE="${LOG_DIR}/raspi4-config-retention.log"
